<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>travel-recommendation - Discover Your Next Adventure</title>
    <link rel="stylesheet" href="style.css" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>travel-recommendation</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <!-- Search Bar -->
            <div class="search-container">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Enter a destination or keyword..."
                />
                <button id="searchBtn"><i class="fas fa-search"></i></button>
                <button id="clearBtn">Clear</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>EXPLORE<br />DREAM<br />DESTINATION</h1>
            <p>
                It encourages exploration of unfamiliar territories, embracing
                diverse cultures and landscapes, while pursuing the desired
                destination that captivates the heart and ignites a sense of
                wonder.
            </p>
            <button class="btn-book">BOOK NOW</button>
        </div>
    </section>

    <!-- Search Results Container -->
    <div id="resultsContainer" class="results-container"></div>

    <!-- Social Media Icons -->
    <div class="social-icons">
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-tiktok"></i></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
